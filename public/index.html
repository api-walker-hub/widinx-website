<meta charset="utf-8">
<title>WidinX Regulation OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F5F3EE;--surface:#FFFFFF;--surface-2:#FAF8F3;--ink:#1E2A24;--muted:#6A7570;--hair:#E3DED3;--hair-2:#EFEBE2;
  --primary:#1B3D2F;--primary-ink:#F5F3EE;--primary-soft:#E4EFE7;--primary-soft-ink:#1B3D2F;
  --ready:#1F6B45;--ready-bg:#E3F2E8;--warn:#8A5A00;--warn-bg:#FBEFD6;--crit:#9B2C2C;--crit-bg:#FBE4E4;--review:#2F4F8F;--review-bg:#E7EEF9;--info:#4B5563;--info-bg:#ECEAE3;
  --shadow:0 1px 2px rgba(30,42,36,.06),0 8px 24px rgba(30,42,36,.06);
  --f-display:"Manrope",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141A17;--surface:#1B221E;--surface-2:#202823;--ink:#ECE9E1;--muted:#9AA39D;--hair:#2C352F;--hair-2:#252D28;
  --primary:#7FBF9B;--primary-ink:#0F1A14;--primary-soft:#22362B;--primary-soft-ink:#BFE3CD;
  --ready:#7FBF9B;--ready-bg:#1D3327;--warn:#E3B45C;--warn-bg:#3A2E14;--crit:#E28B8B;--crit-bg:#3B1F1F;--review:#93B3EA;--review-bg:#1E2A3F;--info:#B7BDB9;--info-bg:#2A312D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{
  --paper:#141A17;--surface:#1B221E;--surface-2:#202823;--ink:#ECE9E1;--muted:#9AA39D;--hair:#2C352F;--hair-2:#252D28;
  --primary:#7FBF9B;--primary-ink:#0F1A14;--primary-soft:#22362B;--primary-soft-ink:#BFE3CD;
  --ready:#7FBF9B;--ready-bg:#1D3327;--warn:#E3B45C;--warn-bg:#3A2E14;--crit:#E28B8B;--crit-bg:#3B1F1F;--review:#93B3EA;--review-bg:#1E2A3F;--info:#B7BDB9;--info-bg:#2A312D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;font-weight:700}
h3{font-size:13px;font-weight:700}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--hair);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px 14px;border-bottom:1px solid var(--hair-2)}
.brand .mark{width:28px;height:28px;border-radius:7px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:12px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:-.01em}
.brand small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav .eyebrow{padding:10px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a svg{width:16px;height:16px;flex:none;color:var(--muted)}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--primary-soft);color:var(--primary-soft-ink);font-weight:600}
.nav a.on svg{color:currentColor}
.nav .count{margin-left:auto;font-size:11px;background:var(--hair-2);border-radius:999px;padding:1px 7px;color:var(--muted)}
.tenant{margin-top:auto;margin:auto 10px 12px;padding:12px;border:1px solid var(--hair);border-radius:10px;background:var(--surface-2)}
.tenant b{display:block;font-size:13px}
.tenant span{font-size:12px;color:var(--muted)}
.main{min-width:0}
.top{height:56px;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:5}
.search{flex:1;max-width:560px;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--hair);border-radius:8px;padding:7px 12px;color:var(--muted)}
.search svg{width:14px;height:14px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.badge.info{background:var(--info-bg);color:var(--info)}
.badge.ready{background:var(--ready-bg);color:var(--ready)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.crit{background:var(--crit-bg);color:var(--crit)}
.badge.review{background:var(--review-bg);color:var(--review)}
.badge.primary{background:var(--primary-soft);color:var(--primary-soft-ink)}
.badge.tenant{background:var(--surface-2);border:1px solid var(--hair);color:var(--muted);text-transform:none;letter-spacing:0}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:11px;font-weight:700}
.iconbtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
.iconbtn:hover{background:var(--surface-2);border-color:var(--hair)}
.iconbtn svg{width:16px;height:16px}
.page{padding:22px 24px 40px;display:flex;flex-direction:column;gap:18px}
.pagehead{display:flex;align-items:flex-start;gap:16px}
.pagehead .grow{flex:1;min-width:0}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:8px;border:1px solid var(--hair);background:var(--surface);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn svg{width:14px;height:14px}
.motto{display:flex;align-items:center;gap:10px;border-left:3px solid var(--primary);padding:6px 12px;background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.02em}
.motto .eyebrow{color:var(--primary)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--hair);background:var(--surface);font-size:12px;font-weight:600}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.select{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--hair);border-radius:8px;background:var(--surface);font-size:13px;cursor:pointer}
.select svg{width:14px;height:14px;flex:none;color:var(--muted)}
.link svg,.tabs svg,.chip svg,.tag svg,.afous svg,.flag svg{width:12px;height:12px}
textarea.input{resize:vertical;font-family:var(--f-body)}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{padding:6px 12px;font-weight:600;font-size:12px}
.seg button.on{background:var(--ink);color:var(--paper)}
.grid{display:grid;gap:14px}
.g5{grid-template-columns:repeat(5,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:12px}
.card .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--hair-2)}
.card .hd .link{margin-left:auto;font-size:12px;color:var(--muted);text-decoration:none;font-weight:600}
.card .bd{padding:14px 16px}
.kpi{padding:14px 16px;border-top:3px solid var(--primary)}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi.warn{border-top-color:var(--warn)}.kpi.crit{border-top-color:var(--crit)}.kpi.ready{border-top-color:var(--ready)}.kpi.review{border-top-color:var(--review)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--hair)}
td{padding:11px 12px;border-bottom:1px solid var(--hair-2);vertical-align:middle}
tr.row:hover td{background:var(--surface-2);cursor:pointer}
.list{display:flex;flex-direction:column}
.list .it{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--hair-2)}
.list .it:last-child{border-bottom:0}
.list .it:hover{background:var(--surface-2);cursor:pointer}
.bar{height:6px;border-radius:3px;background:var(--hair-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary)}
/* product cards */
.pcard{display:flex;flex-direction:column}
.pcard .ph{display:flex;align-items:center;gap:12px;padding:14px 16px}
.pcard .ico{width:40px;height:40px;border-radius:10px;background:var(--surface-2);border:1px solid var(--hair);display:grid;place-items:center}
.pcard .ico svg{width:18px;height:18px;color:var(--primary)}
.pcard .tags{display:flex;gap:6px;padding:0 16px 12px;border-bottom:1px solid var(--hair-2)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--hair);color:var(--muted);font-weight:600}
.mrow{padding:12px 16px;border-bottom:1px solid var(--hair-2);display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.mrow:last-child{border-bottom:0}
.mrow b{font-size:13px}
.mrow .meta{grid-column:1/-1;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.mrow .next{grid-column:1;font-size:12px}
.mrow .btn{grid-column:2;justify-self:end}
/* stepper */
.stepper{display:flex;align-items:center;gap:0;overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--hair);border-radius:999px;background:var(--surface);font-size:12px;font-weight:600;white-space:nowrap}
.step.done{background:var(--primary-soft);color:var(--primary-soft-ink);border-color:transparent}
.step.now{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.step .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.7}
.stepper .arr{width:22px;height:1px;background:var(--hair);flex:none;margin:0 2px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--hair)}
.tabs button{padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--primary)}
.tabs .cnt{margin-left:6px;font-size:11px;color:var(--muted)}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto}
.col{background:var(--surface-2);border:1px solid var(--hair);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--hair)}
.col.crit{border-top-color:var(--crit)}.col.warn{border-top-color:var(--warn)}.col.review{border-top-color:var(--review)}.col.ready{border-top-color:var(--ready)}.col.done{border-top-color:var(--primary)}
.col .ch{display:flex;align-items:center;gap:8px;padding:2px 4px 4px;font-family:var(--f-display);font-weight:700;font-size:13px}
.col .ch .cnt{margin-left:auto;font-size:11px;background:var(--surface);border:1px solid var(--hair);border-radius:999px;padding:1px 7px;color:var(--muted)}
.kcard{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.02)}
.kcard:hover{border-color:var(--primary)}
.kcard .t{font-weight:600;line-height:1.35}
.kcard .m{font-size:12px;color:var(--muted)}
.kcard .f{display:flex;align-items:center;gap:8px;margin-top:2px}
.kcard .f .avatar{width:22px;height:22px;font-size:9px}
.kcard .f .btn{margin-left:auto}
/* outputs */
.lcstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.lc{padding:12px;border:1px solid var(--hair);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;gap:2px;cursor:pointer}
.lc.on{border-color:var(--primary);background:var(--primary-soft)}
.lc .v{font-family:var(--f-display);font-size:22px;font-weight:800}
.lc .l{font-size:12px;font-weight:700;font-family:var(--f-display)}
.lc .d{font-size:11px;color:var(--muted)}
.ocard{display:flex;flex-direction:column;border-top:3px solid var(--primary)}
.ocard .oh{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.ocard .oh .eyebrow{font-size:10px}
.ocard .chips{padding:4px 16px 10px}
.ocard .chip{font-size:11px;padding:3px 8px;font-weight:500}
.ocard .of{display:flex;gap:8px;padding:10px 16px 14px;margin-top:auto}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(20,26,23,.35);z-index:20;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:520px;max-width:92vw;background:var(--surface);border-left:1px solid var(--hair);z-index:21;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--hair)}
.drawer .db{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.modal{position:fixed;inset:0;z-index:30;display:none;place-items:center}
.modal.open{display:grid}
.modal .box{width:560px;max-width:92vw;background:var(--surface);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.modal .box .hd{padding:14px 18px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:10px}
.modal .box .bd{padding:18px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.input{border:1px solid var(--hair);border-radius:8px;padding:8px 11px;background:var(--paper);font:inherit;color:inherit;width:100%}
.dropzone{border:1.5px dashed var(--hair);border-radius:10px;padding:22px;text-align:center;color:var(--muted);background:var(--paper)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;z-index:40;transition:.2s;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%)}
/* afous */
.afous{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--primary-soft);color:var(--primary-soft-ink);font-size:11px;font-weight:700;font-family:var(--f-display)}
.afous svg{width:12px;height:12px}
.sugg{border:1px solid var(--hair);border-radius:10px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.sugg .t{font-weight:600}
/* admin */
.admin{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
.subnav{display:flex;flex-direction:column;gap:2px;padding:8px;background:var(--surface);border:1px solid var(--hair);border-radius:12px}
.subnav button{text-align:left;padding:8px 10px;border-radius:8px;font-weight:600;color:var(--muted)}
.subnav button.on{background:var(--primary-soft);color:var(--primary-soft-ink)}
.matrix td:not(:first-child){text-align:center}
.cb{display:inline-block;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--hair);background:var(--surface);vertical-align:middle}
.cb.on{background:var(--primary);border-color:var(--primary);position:relative}
.cb.on::after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;border:solid var(--primary-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.toggle{width:36px;height:20px;border-radius:999px;background:var(--hair);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:.15s}
.toggle.on{background:var(--primary)}.toggle.on::after{left:18px}
.tile{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--hair);border-radius:10px;background:var(--surface)}
.tile.on{background:var(--primary-soft);border-color:transparent}
.tile b{display:block}.tile small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:2px 0 4px}
.tile p{margin:0;font-size:12px;color:var(--muted)}
.scope{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.scope .s{padding:12px;border:1px solid var(--hair);border-radius:10px;background:var(--surface)}
.scope .s.on{border-color:var(--primary);background:var(--primary-soft)}
.scope small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* projects */
.projects{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
.folders{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.folders button{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;text-align:left;font-weight:500}
.folders button.on{background:var(--primary-soft);color:var(--primary-soft-ink);font-weight:600}
.folders button svg{width:14px;height:14px;color:var(--muted)}
.folders .cnt{margin-left:auto;font-size:11px;color:var(--muted)}
.pjcard{padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.pjcard:hover{border-color:var(--primary)}
.pjcard .ph2{display:flex;align-items:center;gap:10px}
.pjcard .letter{width:34px;height:34px;border-radius:9px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.pjcard .assets{display:flex;gap:10px;font-size:12px;color:var(--muted)}
/* passport (public) */
.pub{max-width:1080px;margin:0 auto;padding:28px 24px 60px;display:flex;flex-direction:column;gap:20px}
.pubtop{display:flex;align-items:center;gap:12px}
.pubtop .lang{margin-left:auto}
.hero{display:grid;grid-template-columns:360px 1fr;gap:22px}
.photo{background:var(--surface);border:1px solid var(--hair);border-radius:16px;aspect-ratio:1;display:grid;place-items:center;position:relative;overflow:hidden}
.photo svg{width:70%;height:70%}
.qr{position:absolute;right:12px;bottom:12px;width:84px;height:84px;background:#fff;border:1px solid var(--hair);border-radius:8px;padding:6px}
.qr canvas{width:100%;height:100%;image-rendering:pixelated}
.herotxt{display:flex;flex-direction:column;gap:12px}
.herotxt h1{font-size:32px;font-weight:800;letter-spacing:-.02em}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.flag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--hair);background:var(--surface);font-size:12px;font-weight:600}
.carbon{display:flex;gap:4px;align-items:flex-end}
.carbon span{flex:1;height:34px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;opacity:.35}
.carbon span.on{opacity:1;outline:3px solid var(--ink);outline-offset:2px}
.aud{display:inline-flex;border:1px solid var(--hair);border-radius:10px;overflow:hidden;background:var(--surface)}
.aud button{padding:9px 14px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.aud button.on{background:var(--primary);color:var(--primary-ink)}
.sections{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sec{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sec dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px}
.sec dt{color:var(--muted)}.sec dd{margin:0;font-weight:500}
.timeline{display:flex;flex-direction:column;gap:8px}
.timeline .ev{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:13px}
.timeline .ev .d{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.lock{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13px}
/* sign in */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth .left{padding:48px;display:flex;flex-direction:column;gap:26px}
.auth .left h1{font-size:42px;line-height:1.05;font-weight:800;letter-spacing:-.02em;max-width:14ch}
.auth .left h1 em{font-style:normal;color:var(--primary)}
.auth .right{background:var(--surface);border-left:1px solid var(--hair);padding:40px 48px;display:flex;flex-direction:column;gap:18px}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px solid var(--hair);border-radius:12px;cursor:pointer;background:var(--surface)}
.opt.on{border-color:var(--primary);background:var(--primary-soft)}
.opt .ico{width:38px;height:38px;border-radius:9px;background:var(--surface-2);border:1px solid var(--hair);display:grid;place-items:center;flex:none}
.opt .ico svg{width:18px;height:18px;color:var(--primary)}
.opt b{display:block}.opt small{color:var(--muted)}
.opt .radio{margin-left:auto;width:18px;height:18px;border-radius:50%;border:2px solid var(--hair)}
.opt.on .radio{border-color:var(--primary);background:var(--primary);box-shadow:inset 0 0 0 3px var(--surface)}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;border-top:1px solid var(--hair);padding-top:16px}
.pillars b{display:block;font-family:var(--f-display)}
.pillars p{margin:2px 0 0;font-size:12px;color:var(--muted)}
/* partner */
.client{display:flex;flex-direction:column;gap:10px;padding:16px}
.perm{display:flex;gap:6px}
.perm span{flex:1;text-align:center;font-size:11px;padding:4px;border-radius:6px;background:var(--surface-2);border:1px solid var(--hair);font-weight:600}
.boundary{padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--hair);font-size:12px}
.boundary b{display:block}
/* chart bits */
.chart{width:100%;height:150px;display:block}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:11px;padding:4px 8px;border-radius:6px;display:none;white-space:nowrap}
.hint{position:fixed;left:24px;bottom:20px;z-index:6;background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted);box-shadow:var(--shadow)}
.hint b{color:var(--ink)}

  else if(h==='packs') html=shell(vPacks(),'packs');
  else if(h==='clients') html=shell(vClients(),'clients');
  else if(h==='outputs/new') html=shell(vWizard(),'outputs');

}

  if(d.notif!==undefined){ openDrawer(notifDrawer()); return; }

  if(d.filter){ S.filter=d.filter; render(); return; }
  if(d.view){ S.view=d.view; render(); return; }
  if(d.casetab){ S.caseTab=d.casetab; render(); return; }
  if(d.admintab){ S.adminTab=d.admintab; render(); return; }
  if(d.folder){ S.folder=d.folder; render(); return; }
  if(d.scope){ S.scope=d.scope; render(); return; }
  if(d.audience){ S.audience=d.audience; if(S.route!=='passport'){ location.hash='#/passport'; } else render(); return; }
  if(d.access){ S.access=d.access; render(); return; }
  if(d.outstate){ S.outState=d.outstate; render(); return; }
  if(d.output){ openDrawer(outputDrawer(d.output)); return; }
  if(d.afous){ if(d.afous==='drawer') openDrawer(afousDrawer()); else openDrawer(afousDrawer()); return; }
  if(d.modal){ openModal(d.modal==='evidence'?evidenceModal:d.modal==='lifecycle'?lifecycleModal:d.modal==='newcase'?newCaseModal:newOutputModal); return; }
  if(d.evidence!==undefined){ S.evidenceAdded=true; closeAll(); toast('Evidence attached · re-evaluated · 2 gaps left'); render(); return; }
  if(d.toggle!==undefined){ t.classList.toggle('on'); toast('Saved'); return; }
  if(d.cb!==undefined){ t.classList.toggle('on'); return; }
  if(d.delegated){ toast('Opening '+d.delegated+' scoped workspace'); setTimeout(()=>go('products'),500); return; }
  if(d.toast){ toast(d.toast); }
});
$('#scrim').addEventListener('click',closeAll);
/* drag & drop: market cases move between lifecycle stages on the board */
document.addEventListener('dragstart',e=>{ const c=e.target.closest('[data-drag]'); if(c){ e.dataTransfer.setData('text/plain',c.dataset.drag); c.style.opacity=.5; } });
document.addEventListener('dragend',e=>{ const c=e.target.closest('[data-drag]'); if(c) c.style.opacity=1; });
document.addEventListener('dragover',e=>{ const col=e.target.closest('[data-dropstage]'); if(col){ e.preventDefault(); col.style.outline='2px solid var(--primary)'; } });
document.addEventListener('dragleave',e=>{ const col=e.target.closest('[data-dropstage]'); if(col) col.style.outline=''; });
document.addEventListener('drop',e=>{ const col=e.target.closest('[data-dropstage]'); if(!col) return; e.preventDefault(); const id=e.dataTransfer.getData('text/plain'); const hit=caseById(id); if(hit){ hit.c.stage=+col.dataset.dropstage; toast(`${hit.p.name} · ${hit.c.market} moved to ${LIFECYCLE[hit.c.stage]} — readiness unchanged`); render(); } });
document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openDrawer(searchDrawer()); } if(e.key==='Escape') closeAll(); });
render();
if (QS.get('drawer')) openDrawer(outputDrawer(QS.get('drawer')));
if (QS.get('afous')) openDrawer(afousDrawer());
if (QS.get('modal')) openModal(QS.get('modal')==='evidence'?evidenceModal:QS.get('modal')==='lifecycle'?lifecycleModal:QS.get('modal')==='newcase'?newCaseModal:newOutputModal);
</script>
